name: Linting

on:
    pull_request:
    push:
        branches:
            - trunk

concurrency:
    group: linting-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    changed-files:
        name: Detect changed files
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        outputs:
            php: ${{ steps.filter.outputs.php }}
            js: ${{ steps.filter.outputs.js }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      php:
                        - '**/*.php'
                        - 'composer.json'
                        - 'composer.lock'
                        - '.phpcs.xml.dist'
                        - 'tools/composer.json'
                        - '.github/workflows/linting.yml'
                      js:
                        - '**/*.{js,jsx,ts,tsx,mjs,cjs}'
                        - '**/*.{json,md,yml,yaml}'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'eslint.config.mjs'
                        - '.github/workflows/linting.yml'

    phpcs:
        name: PHPCS (Jetpack standard)
        needs: changed-files
        if: needs.changed-files.outputs.php == 'true' || github.event_name == 'push'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - name: Determine composer cache directory
              run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> "$GITHUB_ENV"

            - name: Cache composer downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.COMPOSER_CACHE_DIR }}
                  key: composer-lint-${{ runner.os }}-${{ hashFiles('tools/composer.json') }}
                  restore-keys: composer-lint-${{ runner.os }}-

            - name: Install lint tooling
              run: composer install --working-dir=tools --no-interaction --no-progress

            - name: Run PHPCS
              run: composer run-script lint-php

    eslint:
        name: ESLint + Prettier
        needs: changed-files
        if: needs.changed-files.outputs.js == 'true' || github.event_name == 'push'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '20'

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

            - name: Check Prettier formatting
              run: pnpm run format:check
